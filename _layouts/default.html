<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <section class="page-header">
      <h1 class="project-name">{{ site.title }}</h1>
      <h2 class="project-tagline">{{ site.description }}</h2>
      
      <!-- Custom Site Navigation Bar -->
      <nav style="margin-top: 20px;">
        <a href="{{ '/' | relative_url }}" class="btn">Home</a>
        <a href="{{ '/page1' | relative_url }}" class="btn">Cloud Infra</a>
        <a href="{{ '/page2' | relative_url }}" class="btn">CI/CD</a>
        <a href="{{ '/page3' | relative_url }}" class="btn">Monitoring</a>
        <a href="{{ '/page4' | relative_url }}" class="btn">Agile</a>
        <a href="{{ '/page5' | relative_url }}" class="btn">Automation</a>
      </nav>
    </section>

    <section class="main-content">
      {{ content }}

      <footer class="site-footer" style="margin-top: 40px; border-top: 1px solid #e9ecef; padding-top: 20px;">
        <p style="font-size: 0.9em; color: #6c757d;">DevSecOps Course Portfolio | Johns Hopkins University Academic Submission</p>
      </footer>
    </section>
  </body>
</html>
